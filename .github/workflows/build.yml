name: Build Hybrid Photo Assist

# Manual only: run from the Actions tab or the API.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill-model-check:
    name: Check the erase-and-fill AI model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download model (same URL the app uses)
        run: |
          curl -fL --retry 3 -o lama_dilated.tflite \
            https://huggingface.co/mlboydaisuke/LaMa-Dilated-LiteRT/resolve/main/lama_dilated.tflite
          ls -l lama_dilated.tflite
      - name: Run model on a test picture
        run: |
          pip install --quiet numpy ai-edge-litert || pip install --quiet numpy tensorflow
          python tools/check_fill_model.py lama_dilated.tflite

  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Download the tap-to-select model (Google MediaPipe)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/interactive_segmentation.task \
            https://storage.googleapis.com/mediapipe-models/interactive_segmenter_v2/magic_touch/int8/1/interactive_segmentation.task
          ls -l app/src/main/assets
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee -a ci.log
      - name: Build unsigned release APK
        # The signing key never goes to GitHub. The APK is signed afterwards with Steven's own key.
        env:
          HPA_UNSIGNED: "1"
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleRelease 2>&1 | tee -a ci.log
      - name: Package unsigned APK and signing tools
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "built: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          unzip -l "$APK" | grep -E "interactive_segmentation.task|lib/arm64-v8a/" | head -20
          V=$(grep versionName version.properties | cut -d= -f2)
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" "out/HybridPhotoAssist-$V-unsigned.apk"
          "$BT/zipalign" -c -p 4 "out/HybridPhotoAssist-$V-unsigned.apk" && echo "zipalign OK"
          cp "$BT/lib/apksigner.jar" out/
          ls -l out
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          touch ci.log
          grep -E "^e: |error:|What went wrong|FAILED|Could not |Unresolved|Exception|> " ci.log | head -45 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
      - name: Publish log and output to the ci-out branch
        if: always()
        shell: bash
        run: |
          touch ci.log
          mkdir -p /tmp/ciout
          cp ci.log /tmp/ciout/ci.log
          [ -d out ] && cp out/* /tmp/ciout/ || true
          [ -d app/build/reports/tests ] && cp -r app/build/reports/tests /tmp/ciout/test-reports || true
          cd /tmp/ciout
          git init -q -b ci-out
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          echo "run ${{ github.run_id }} ${{ job.status }}" > RUN.txt
          git add -A && git commit -q -m "CI run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: HybridPhotoAssist-unsigned
          path: out/
      - name: Attach unsigned APK to a pre-release (backup download path)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep versionName version.properties | cut -d= -f2)
          gh release create "build-$V-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" --prerelease \
            --title "Build $V #${{ github.run_number }} (unsigned)" \
            --notes "Unsigned build from run ${{ github.run_id }}. Install the signed APK Claude sends, not this one."
